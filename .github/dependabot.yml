version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # 供应链冷却：仅提发布满 N 天的版本，与 CI 的 pnpm minimumReleaseAge(1 天)门对齐，
    # 避免 dependabot 把 group PR bump 到刚发布的新包而撞门
    # （@typescript-eslint 每周一发版，是高频触发源）。
    cooldown:
      default-days: 7
    groups:
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
      vite:
        patterns:
          - 'vite*'
          - 'vitest*'
    ignore:
      # eslint 10 暂不可升：eslint-plugin-react 最新 7.37.5 的 eslint peer 上限为 ^9.7
      # （eslint 10 移除了 plugin-react 仍在调用的 context.getFilename()，加载 react/* 规则即崩）。
      # 待 eslint-plugin-react 支持 eslint 10 后，删除本 ignore 即可解锁升级。
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
