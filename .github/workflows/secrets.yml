name: Secret Scan

# Full-history gitleaks on every PR and on every main push. Feature-branch pushes don't
# trigger this — pre-commit gitleaks on the developer's machine already covers them, and
# every commit will be re-scanned in PR before merge anyway.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
