[package]
name = "ai-email"
version = "0.1.0"
description = "AI-assisted email client (Tauri 2 + Rust core)"
authors = ["zhuxbo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_email_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri / FFI ───────────────────────────────────────────
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Async runtime ─────────────────────────────────────────
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "fs",
] }

# ── Database ──────────────────────────────────────────────
# Embedded SQLite (bundled libsqlite3 — no system dependency). The DB file lives in the OS
# app-data dir and is created + migrated on first launch, so the app is zero-config / offline.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "uuid",
    "time",
    "json",
    "macros",
    "migrate",
] }

# ── Error handling ────────────────────────────────────────
anyhow = "1"
thiserror = "2"

# ── Logging / tracing ─────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Common types ──────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# ── Config / env ──────────────────────────────────────────
dotenvy = "0.15"

# ── Secrets ───────────────────────────────────────────────
# `secrecy` wraps every string we shouldn't log; `expose_secret()` is the only
# way to read it back. The serde feature isn't enabled — Tauri forms
# deserialize into a plain `String` we wrap on the next line.
secrecy = "0.10"

# ── IMAP / TLS ────────────────────────────────────────────
# rustls everywhere (matches sqlx). webpki-roots ships the Mozilla CA bundle so
# we don't depend on the OS trust store.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
futures = "0.3"

# ── Mail parsing ──────────────────────────────────────────
# Header parsing now; body parsing (multipart, encoding, charset) in Sprint 1.4.
mail-parser = "0.11"

# ── HTTP client for Anthropic API ─────────────────────────
# rustls everywhere (matches sqlx + tokio-rustls). No default-features so we don't drag in
# the native-tls backend. brotli/gzip on so the API can return compressed responses.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
] }

# ── Hashing ───────────────────────────────────────────────
# Used for prompt_hash dedup keys in ai_results.
sha2 = "0.10"
hex = "0.4"

# ── SMTP send ─────────────────────────────────────────────
# lettre = SMTP wire client + Message builder. Implicit-TLS profile (port 465) used by QQ;
# tokio1-rustls-tls keeps the TLS stack consistent with sqlx / async-imap / reqwest.
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "ring",
    "webpki-roots",
] }

# OS-native credential vault. Platform features are mutually exclusive on
# native targets so we list one per `cfg`. Keep `default-features = false`
# everywhere; the default set drags libsecret into macOS builds.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
default-features = false
features = ["sync-secret-service", "crypto-rust"]

# Android has no OS keychain reachable through the NDK FFI, so `keyring` ships no
# Android backend. `android-keyring` bridges to the Android KeyStore + app-private
# SharedPreferences over JNI and registers itself as keyring's default credential
# builder (see `run()` in lib.rs), so `crate::keychain` compiles and runs unchanged.
# Tauri Mobile already initializes ndk-context, so no Kotlin glue is required.
[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "3", default-features = false }
android-keyring = "0.2"

# Release profile tuned for binary size — the Android APK ships a Rust .so per ABI
# (4 of them), so size matters there most. Shared by ALL targets incl. desktop:
# strip/lto/opt-z shrink desktop binaries too. `panic = "abort"` also prevents
# unwinding across the Tauri FFI boundary (CLAUDE.md: never panic across FFI).
[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
