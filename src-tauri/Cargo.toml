[package]
name = "ai-email"
version = "0.1.0"
description = "AI-assisted email client (Tauri 2 + Rust core)"
authors = ["zhuxbo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_email_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri / FFI ───────────────────────────────────────────
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Async runtime ─────────────────────────────────────────
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "fs",
] }

# ── Database ──────────────────────────────────────────────
# rustls everywhere — no native-tls dep so the build stays portable.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "time",
    "json",
    "macros",
    "migrate",
] }

# ── Error handling ────────────────────────────────────────
anyhow = "1"
thiserror = "2"

# ── Logging / tracing ─────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Common types ──────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# ── Config / env ──────────────────────────────────────────
dotenvy = "0.15"

# ── Secrets ───────────────────────────────────────────────
# `secrecy` wraps every string we shouldn't log; `expose_secret()` is the only
# way to read it back. The serde feature isn't enabled — Tauri forms
# deserialize into a plain `String` we wrap on the next line.
secrecy = "0.10"

# ── IMAP / TLS ────────────────────────────────────────────
# rustls everywhere (matches sqlx). webpki-roots ships the Mozilla CA bundle so
# we don't depend on the OS trust store.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
futures = "0.3"

# ── Mail parsing ──────────────────────────────────────────
# Header parsing now; body parsing (multipart, encoding, charset) in Sprint 1.4.
mail-parser = "0.10"

# OS-native credential vault. Platform features are mutually exclusive on
# native targets so we list one per `cfg`. Keep `default-features = false`
# everywhere; the default set drags libsecret into macOS builds.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
default-features = false
features = ["sync-secret-service", "crypto-rust"]
