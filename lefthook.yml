# 本机安装 lefthook 和 gitleaks 后运行 lefthook install。
# 检查失败不得用 --no-verify 绕过。
pre-commit:
  parallel: true
  commands:
    rust-format:
      glob: 'server/**/*.rs'
      run: cargo fmt --manifest-path server/Cargo.toml --check
      fail_text: '请运行 cargo fmt --manifest-path server/Cargo.toml'
    rust-clippy:
      glob: 'server/**/*.rs'
      run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      fail_text: '请修复 Rust clippy 警告'
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact -v
      fail_text: '请移除待提交内容中的凭据'

commit-msg:
  commands:
    conventional-title:
      run: >-
        python3 -c 'import pathlib,re,sys; title=pathlib.Path(sys.argv[1]).read_text().splitlines()[0]; sys.exit(0 if re.fullmatch(r"(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert): .{1,93}", title) and len(title)<=100 else 1)' "{1}"
      fail_text: '提交标题须为 type: 主题，且不超过100字符'

pre-push:
  commands:
    server-tests:
      run: cargo test --locked --manifest-path server/Cargo.toml
      fail_text: '服务端测试必须通过'
    bridge-tests:
      run: cargo build --locked --manifest-path server/Cargo.toml && python3 -m unittest discover -s scripts -p 'test_*.py'
      fail_text: 'MCP桥接及服务冒烟测试必须通过'
