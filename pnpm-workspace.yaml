packages:
  - .
allowBuilds:
  esbuild: true
  lefthook: true
# Force vulnerable transitive deps onto safe versions.
# `@vitest/coverage-v8` (and friends) still pull in vite 5.x / esbuild 0.19.x
# which carry several advisories — these selectors only rewrite the bad ranges.
overrides:
  esbuild@<0.25.0: '>=0.25.0'
  vite@<5.4.18: '>=5.4.18'
